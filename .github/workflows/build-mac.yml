name: Build Raccoon Arcade (Mac M1)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run logic tests
        run: npm test

      - name: Build the Apple Silicon app (.dmg)
        run: npm run build:mac

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: RaccoonArcade-arm64
          path: dist/*.dmg
